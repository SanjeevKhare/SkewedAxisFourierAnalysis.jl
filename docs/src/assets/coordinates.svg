<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" role="img" aria-labelledby="title desc"><title id="title">The implemented skew coordinate transform</title><desc id="desc">The horizontal basis is (1,0), the second is minus cosine theta, sine theta. The included angle phi equals 180 degrees minus theta.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#5145b8"/></marker></defs><rect width="620" height="420" rx="20" fill="#f7f7fc"/><g font-family="sans-serif"><text x="34" y="40" font-size="13" font-weight="700" letter-spacing="2" fill="#5145b8">COORDINATES, MADE EXPLICIT</text><path d="M110 300h270L490 110H220Z" fill="#e6e2fa" stroke="#b4abd9" stroke-width="1.5"/><g stroke="#5145b8" stroke-width="3" marker-end="url(#arrow)"><path d="M110 300h270"/><path d="m110 300 110-190"/></g><path d="M168 300a58 58 0 0 0-29-50" fill="none" stroke="#0b807b" stroke-width="2"/><g fill="#24243b" font-size="17"><text x="210" y="332">a = (1, 0)</text><text x="229" y="100">b = (−cos θ, sin θ)</text><text x="173" y="270" fill="#0b807b">φ</text><text x="91" y="326">0</text><text x="370" y="220" font-size="18" fill="#5145b8">φ = 180° − θ</text><text x="34" y="380" font-size="16">U = x + y cot θ</text><text x="330" y="380" font-size="16">V = y csc θ</text></g></g></svg>
